name: NAF Database Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo_sqlite
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer run-script test

    - name: Check code style
      run: composer style:check

  network-drivers:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: naf-disposable-test
          MYSQL_DATABASE: naf_security
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pnaf-disposable-test"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: naf-disposable-test
          POSTGRES_DB: naf_security
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NAF_TEST_DB_PASSWORD: naf-disposable-test
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer test
        env:
          NAF_TEST_DB_DRIVER: mysql
          NAF_TEST_DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      - run: composer test
        env:
          NAF_TEST_DB_DRIVER: pgsql
          NAF_TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
